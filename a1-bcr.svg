<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="740" fill="#fff"/>
  <text x="60" y="50" font-size="28" font-weight="700" fill="#111">BCR on 62 documentation questions, same index</text>
  <text x="60" y="80" font-size="16" fill="#555">Budget-constrained recall at 8192 bytes. Higher is better.</text>
  <g transform="translate(0,100)"><!-- axis -->
  <line x1="120" y1="520" x2="1140" y2="520" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="20" x2="120" y2="520" stroke="#333" stroke-width="2"/>
  <g font-size="14" fill="#555" text-anchor="end">
    <text x="110" y="525">0.00</text><line x1="115" y1="520" x2="120" y2="520" stroke="#333"/>
    <text x="110" y="425">0.05</text><line x1="115" y1="420" x2="1140" y2="420" stroke="#eee"/>
    <text x="110" y="325">0.10</text><line x1="115" y1="320" x2="1140" y2="320" stroke="#eee"/>
    <text x="110" y="225">0.15</text><line x1="115" y1="220" x2="1140" y2="220" stroke="#eee"/>
    <text x="110" y="125">0.20</text><line x1="115" y1="120" x2="1140" y2="120" stroke="#eee"/><text x="110" y="25">0.25</text><line x1="115" y1="20" x2="1140" y2="20" stroke="#eee"/>
  </g>
  <!-- bars: scale 0.25 = 400px -> 1 unit = 1600 px ; y = 520 - v*1600 -->
  <g font-size="16" text-anchor="middle">
    <rect x="200" y="258.0" width="140" height="262.0" fill="#b8c4d6"/><text x="270" y="248" fill="#111" font-weight="700">0.131</text>
    <text x="270" y="550" fill="#333">lexical, before</text><text x="270" y="572" fill="#777" font-size="13">documents at rank 101+</text>
    <rect x="420" y="150.0" width="140" height="370.0" fill="#c9a27a"/><text x="490" y="140" fill="#111" font-weight="700">0.185</text>
    <text x="490" y="550" fill="#333">plus embeddings</text><text x="490" y="572" fill="#777" font-size="13">on the broken baseline</text>
    <rect x="640" y="112.0" width="140" height="408.0" fill="#3b5b8c"/><text x="710" y="102" fill="#111" font-weight="700">0.204</text>
    <text x="710" y="550" fill="#333">lexical, after</text><text x="710" y="572" fill="#777" font-size="13">two channels, two weights</text>
    <rect x="860" y="40.0" width="140" height="480.0" fill="#2f5d33"/><text x="930" y="30" fill="#111" font-weight="700">0.240</text>
    <text x="930" y="550" fill="#333">after, plus embeddings</text><text x="930" y="572" fill="#777" font-size="13">+0.052, CI includes zero</text>
  </g>
  <text x="60" y="620" font-size="15" fill="#555">Fixing the ranker moved the baseline by 0.073. Embeddings on top of the fixed baseline add 0.052, not yet demonstrated at n = 62.</text>
</g></svg>