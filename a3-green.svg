<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="700" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs>
  <text x="40" y="48" font-size="30" font-weight="700" fill="#111">Green by absence: what the status was derived from</text>
  <g font-size="15" fill="#111">
    <text x="40" y="100" font-size="17" font-weight="700" fill="#333">incident</text>
    <text x="420" y="100" font-size="17" font-weight="700" fill="#333">what turned the step green</text>
    <text x="820" y="100" font-size="17" font-weight="700" fill="#333">the observable that proves the effect</text>
    <text x="1230" y="100" font-size="17" font-weight="700" fill="#333">hid for</text>
    <line x1="40" y1="112" x2="1360" y2="112" stroke="#333"/>

    <rect x="40" y="130" width="1320" height="76" rx="6" fill="#fafafa"/>
    <text x="52" y="158" font-weight="700">Coverage upload</text><text x="52" y="182" fill="#555">Angular library, GitHub Actions</text>
    <text x="420" y="158" font-family="Menlo, monospace" font-size="14">continue-on-error: true</text><text x="420" y="182" font-family="Menlo, monospace" font-size="14">fail_ci_if_error: false</text>
    <text x="820" y="158">a report accepted by the coverage service</text><text x="820" y="182" fill="#555">every upload was rejected: token required</text>
    <text x="1230" y="170" font-weight="700" fill="#8a2c2c">9 merged PRs</text>

    <rect x="40" y="220" width="1320" height="76" rx="6" fill="#fff"/>
    <text x="52" y="248" font-weight="700">Publish job</text><text x="52" y="272" fill="#555">monorepo, Changesets, npm OIDC</text>
    <text x="420" y="248">upstream job skipped on push</text><text x="420" y="272" fill="#555">skip propagates to any bare downstream condition</text>
    <text x="820" y="248">the version present on the registry</text><text x="820" y="272" fill="#555">0.1.0 on main, not on npm, job shows skipped</text>
    <text x="1230" y="260" font-weight="700" fill="#8a2c2c">1 release</text>

    <rect x="40" y="310" width="1320" height="76" rx="6" fill="#fafafa"/>
    <text x="52" y="338" font-weight="700">Release planner</text><text x="52" y="362" fill="#555">same monorepo</text>
    <text x="420" y="338" font-family="Menlo, monospace" font-size="14">planned releases: 0</text><text x="420" y="362" fill="#555">zero is also the correct answer after a rerun</text>
    <text x="820" y="338">a GitHub release for every published package</text><text x="820" y="362" fill="#555">package in 2 of 3 lists, dropped by name lookup</text>
    <text x="1230" y="350" font-weight="700" fill="#8a2c2c">1 package</text>

    <rect x="40" y="400" width="1320" height="76" rx="6" fill="#fff"/>
    <text x="52" y="428" font-weight="700">Cleanup job</text><text x="52" y="452" fill="#555">operations, staging search cluster</text>
    <text x="420" y="428">exit 0 once AMQP messages are published</text><text x="420" y="452" fill="#555">the delete runs later, in a worker, capped at 1000</text>
    <text x="820" y="428">the deleted count in the worker log</text><text x="820" y="452" fill="#555">3609 documents: 2483 after a run, 1483 after another</text>
    <text x="1230" y="440" font-weight="700" fill="#8a2c2c">every Monday</text>

    <rect x="40" y="490" width="1320" height="76" rx="6" fill="#fafafa"/>
    <text x="52" y="518" font-weight="700">Absent CI</text><text x="52" y="542" fill="#555">backend API</text>
    <text x="420" y="518" font-family="Menlo, monospace" font-size="14">pull_request: branches: [master]</text><text x="420" y="542" fill="#555">feature-branch PRs show "no checks reported"</text>
    <text x="820" y="518">a check run attached to the pull request</text><text x="820" y="542" fill="#555">reviewers read absence as pending</text>
    <text x="1230" y="530" font-weight="700" fill="#8a2c2c">per PR</text>
  </g>
  <rect x="40" y="600" width="1320" height="70" rx="8" fill="#edf5ee" stroke="#2f5d33" stroke-width="2"/>
  <text x="60" y="630" font-size="18" font-weight="700" fill="#2f5d33">The repair is the third column.</text>
  <text x="60" y="656" font-size="16" fill="#111">Ask the destination (registry, release API, worker log, check run) whether the effect exists. An exit code says the command ran. A count says it worked.</text>
</svg>
